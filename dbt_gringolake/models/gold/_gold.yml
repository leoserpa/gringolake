version: 2

models:
  - name: dim_investor_type
    description: "Dimensão oficial dos 5 perfis de investidores divulgados no BDI da B3."
    columns:
      - name: investor_type_code
        description: "Código canônico da categoria de investidor (chave primária)."
        data_tests:
          - unique
          - not_null
      - name: display_order
        description: "Ordem padrão de exibição em dashboards e relatórios."
        data_tests:
          - unique
          - not_null

  - name: fct_ibov_investor_flow_daily
    description: >
      Tabela fato Gold no grão (trading_date x investor_type_code) combinando o fechamento oficial
      do Ibovespa com fluxo diário líquido, fluxo acumulado e Média Móvel de 21 pregões (MM21)
      estrita (NULL quando há menos de 21 pregões, conforme ADR-006) por tipo de investidor na B3.
    columns:
      - name: fact_ibov_flow_sk
        description: "Chave primária determinística da fato (trading_date + investor_type_code)."
        data_tests:
          - unique
          - not_null
      - name: trading_date
        description: "Data oficial do pregão na B3."
        data_tests:
          - not_null
      - name: investor_type_code
        description: "Chave estrangeira para dim_investor_type."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_investor_type')
                field: investor_type_code
      - name: ibov_close
        description: "Fechamento oficial do Ibovespa em pontos."
        data_tests:
          - not_null
      - name: cum_net_flow_bi_brl
        description: "Saldo líquido acumulado do fluxo de investidores em R$ bilhões."
        data_tests:
          - not_null
      - name: cum_net_flow_ma21_bi_brl
        description: "Média móvel simples estrita de 21 pregões sobre o fluxo líquido acumulado (R$ bilhões); NULL quando ma21_window_obs_count < 21 (ADR-006)."
      - name: ma21_window_obs_count
        description: "Número de pregões disponíveis na janela móvel atual (1 a 21)."
        data_tests:
          - not_null
      - name: has_full_ma21_window
        description: "Indica se o perfil atingiu 21 pregões completos para o cálculo da MM21."
        data_tests:
          - not_null
      - name: flow_vs_ma21_signal
        description: "Sinal direcional do acumulado em relação à MM21 estrita ('em_formacao' quando < 21 pregões)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["acima_mm21", "abaixo_mm21", "em_formacao"]

  - name: mart_ibov_vs_investors_wide
    description: >
      Mart analítico em formato wide (1 linha por pregão) pronto para os gráficos comparativos
      IBOVESPA × perfis oficiais de investidores da B3 em R$ bilhões.
    columns:
      - name: trading_date
        description: "Data oficial do pregão (chave primária)."
        data_tests:
          - unique
          - not_null
      - name: ibov_close
        description: "Fechamento oficial do Ibovespa em pontos."
        data_tests:
          - not_null
      - name: ma21_window_obs_count
        description: "Menor contagem de pregões na janela da MM21 entre os perfis na data (1 a 21)."
        data_tests:
          - not_null
      - name: has_full_ma21_window
        description: "Indica se todas as categorias já possuem 21 pregões completos na janela da MM21."
        data_tests:
          - not_null

  - name: mart_ibov_vs_pf_short_term
    description: >
      Mart analítico de curto prazo (últimos 160 pregões, rebased na janela) pronto para o gráfico
      'Relação: IBOV x P.F. (CURTO PRAZO)' com acumulado de Pessoa Física, MM21 estrita (ADR-006) e flag de cruzamento.
    columns:
      - name: trading_date
        description: "Data oficial do pregão (chave primária)."
        data_tests:
          - unique
          - not_null
      - name: pf_cum_short_term_bi_brl
        description: "Saldo líquido acumulado de Pessoa Física na janela de curto prazo (R$ bilhões)."
        data_tests:
          - not_null
      - name: pf_cum_short_term_ma21_bi_brl
        description: "Média móvel estrita de 21 pregões sobre o acumulado de curto prazo de PF (R$ bilhões); NULL durante aquecimento (< 21 pregões)."
      - name: ma21_window_obs_count
        description: "Número de pregões disponíveis na janela móvel de curto prazo (1 a 21)."
        data_tests:
          - not_null
      - name: has_full_ma21_window
        description: "Indica se a janela de curto prazo já atingiu 21 pregões completos para a MM21."
        data_tests:
          - not_null

unit_tests:
  - name: test_fct_ibov_investor_flow_daily_warmup_suppresses_ma21
    description: >
      Valida ADR-006 na fase de aquecimento (< 21 pregões): o acumulado contínuo é calculado
      normalmente, mas a MM21 e o spread permanecem NULL e o sinal retorna 'em_formacao'.
    model: fct_ibov_investor_flow_daily
    given:
      - input: ref('int_b3_investor_flow_daily')
        rows:
          - {trading_date: '2026-11-03', trading_month: '2026-11-01', trading_year: 2026, publication_date: '2026-11-05', investor_type_code: 'pessoa_fisica', daily_derivation_method: 'month_start_exact', daily_purchases_k_brl: 5000000.0, daily_sales_k_brl: 4000000.0, daily_net_flow_k_brl: 1000000.0, daily_net_flow_bi_brl: 1.0, mtd_purchases_k_brl: 5000000.0, mtd_sales_k_brl: 4000000.0, mtd_net_flow_k_brl: 1000000.0, mtd_net_flow_bi_brl: 1.0, purchase_share_pct: 5.0, sale_share_pct: 4.0}
          - {trading_date: '2026-11-04', trading_month: '2026-11-01', trading_year: 2026, publication_date: '2026-11-06', investor_type_code: 'pessoa_fisica', daily_derivation_method: 'mtd_diff_exact', daily_purchases_k_brl: 6000000.0, daily_sales_k_brl: 4000000.0, daily_net_flow_k_brl: 2000000.0, daily_net_flow_bi_brl: 2.0, mtd_purchases_k_brl: 11000000.0, mtd_sales_k_brl: 8000000.0, mtd_net_flow_k_brl: 3000000.0, mtd_net_flow_bi_brl: 3.0, purchase_share_pct: 5.5, sale_share_pct: 4.5}
          - {trading_date: '2026-11-05', trading_month: '2026-11-01', trading_year: 2026, publication_date: '2026-11-09', investor_type_code: 'pessoa_fisica', daily_derivation_method: 'mtd_diff_exact', daily_purchases_k_brl: 2000000.0, daily_sales_k_brl: 5000000.0, daily_net_flow_k_brl: -3000000.0, daily_net_flow_bi_brl: -3.0, mtd_purchases_k_brl: 13000000.0, mtd_sales_k_brl: 13000000.0, mtd_net_flow_k_brl: 0.0, mtd_net_flow_bi_brl: 0.0, purchase_share_pct: 4.2, sale_share_pct: 5.8}
      - input: ref('stg_b3_ibov_daily')
        rows:
          - {trading_date: '2026-11-03', ibov_close: 170000.0, ibov_return_1d_pct: 0.5}
          - {trading_date: '2026-11-04', ibov_close: 172000.0, ibov_return_1d_pct: 1.18}
          - {trading_date: '2026-11-05', ibov_close: 171000.0, ibov_return_1d_pct: -0.58}
      - input: ref('dim_investor_type')
        rows:
          - {investor_type_code: 'pessoa_fisica', investor_type_name_pt: 'Pessoa Física', investor_type_short_pt: 'P.F.', display_order: 3}
    expect:
      rows:
        - {trading_date: '2026-11-03', investor_type_code: 'pessoa_fisica', cum_net_flow_bi_brl: 1.0, cum_net_flow_ma21_bi_brl: null, flow_vs_ma21_signal: 'em_formacao', ma21_window_obs_count: 1, has_full_ma21_window: false}
        - {trading_date: '2026-11-04', investor_type_code: 'pessoa_fisica', cum_net_flow_bi_brl: 3.0, cum_net_flow_ma21_bi_brl: null, flow_vs_ma21_signal: 'em_formacao', ma21_window_obs_count: 2, has_full_ma21_window: false}
        - {trading_date: '2026-11-05', investor_type_code: 'pessoa_fisica', cum_net_flow_bi_brl: 0.0, cum_net_flow_ma21_bi_brl: null, flow_vs_ma21_signal: 'em_formacao', ma21_window_obs_count: 3, has_full_ma21_window: false}

  - name: test_fct_ibov_investor_flow_daily_full_21d_ma21_and_crossover
    description: >
      Valida a transição exata no 21º pregão e a janela deslizante no 22º pregão:
      nos 21 primeiros dias (+1 bi/dia), o acumulado vai de 1 a 21 (média exata = 11.0 bi, acima_mm21);
      no 22º pregão (-20 bi), o acumulado cai para 1.0 bi enquanto a janela [2..21, 1] soma 231 (média exata = 11.0 bi, abaixo_mm21).
