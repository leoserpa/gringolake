name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Dagster Defs, Python & dbt Medallion Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --group dev

      - name: Run Python linter (ruff)
        run: uv run ruff check src tests

      - name: Validate Dagster & dbt definitions
        run: uv run dg check defs

      - name: Run Python unit tests and offline Medallion E2E dbt build + tests
        run: uv run pytest -v
