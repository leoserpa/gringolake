name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "src/**"
      - "dbt_gringolake/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Mon-Fri 21:00 America/Sao_Paulo (UTC-3) == Tue-Sat 00:00 UTC (post B3 BDI 20:00 BRT SLA)
    - cron: "0 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Run B3 Medallion Pipeline & Build Evidence.dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reports/package-lock.json

      - name: Restore Bronze B3 snapshots from data-bronze branch
        run: |
          if git fetch origin data-bronze:refs/remotes/origin/data-bronze 2>/dev/null; then
            echo "Restoring persisted Bronze snapshots from origin/data-bronze..."
            git archive origin/data-bronze data/bronze | tar -x
          else
            echo "No data-bronze branch found yet; bootstrapping fresh Bronze layer from B3 APIs."
          fi

      - name: Install Python dependencies (locked)
        run: uv sync --locked --group dev

      - name: Run full B3 Medallion pipeline (Bronze -> Silver -> Gold)
        run: uv run dg launch --job b3_medallion_full_refresh

      - name: Persist Bronze B3 Parquet snapshots to data-bronze branch
        run: |
          WORKTREE_DIR="/tmp/gringolake-data-bronze"
          rm -rf "$WORKTREE_DIR"

          if git show-ref --verify --quiet refs/remotes/origin/data-bronze; then
            git worktree add -B data-bronze "$WORKTREE_DIR" origin/data-bronze
          else
            git worktree add --detach "$WORKTREE_DIR" HEAD
            git -C "$WORKTREE_DIR" checkout --orphan data-bronze
            git -C "$WORKTREE_DIR" rm -rf --ignore-unmatch .
          fi

          mkdir -p "$WORKTREE_DIR/data/bronze"
          rsync -a -m \
            --exclude='raw_json/' \
            --include='*/' \
            --include='*.parquet' \
            --include='.finalized' \
            --exclude='*' \
            data/bronze/ "$WORKTREE_DIR/data/bronze/"

          cat > "$WORKTREE_DIR/README.md" <<'EOF'
          # GringoLake — `data-bronze` Automated Snapshot Branch

          This orphan branch is managed automatically by `.github/workflows/deploy-pages.yml`.
          It stores compact ZSTD Parquet snapshots of official B3 Bronze partitions (`b3_ibov_daily` and `b3_investor_flow_mtd`) so daily runs retain full history beyond B3 BDI's rolling 21-session API retention window.
          EOF

          if [ -n "$(git -C "$WORKTREE_DIR" status --porcelain)" ]; then
            git -C "$WORKTREE_DIR" config user.name "github-actions[bot]"
            git -C "$WORKTREE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$WORKTREE_DIR" add -f README.md data/bronze
            git -C "$WORKTREE_DIR" commit -m "chore(bronze): sync B3 Bronze snapshots ($(date -u +%Y-%m-%d))"
            git -C "$WORKTREE_DIR" push origin data-bronze
          else
            echo "No new Bronze Parquet changes to persist."
          fi

          git worktree remove --force "$WORKTREE_DIR"

      - name: Install Evidence.dev dependencies
        working-directory: reports
        run: npm ci

      - name: Build Evidence.dev sources & static site (strict)
        working-directory: reports
        run: |
          npm run sources:strict
          npm run build:strict

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/build

      - name: Report failure diagnostics to job summary
        if: failure()
        run: |
          {
            echo "### GringoLake Deploy Failed"
            echo "- Trigger: \`${{ github.event_name }}\` (\`${{ github.ref_name }}\`)"
            echo "- Check whether the failure occurred during B3 API ingestion (post-20:00 BRT SLA), dbt Medallion validation, or Evidence.dev static build."
            echo "- Bronze partitions on \`data-bronze\` remain untouched unless the sync step succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
