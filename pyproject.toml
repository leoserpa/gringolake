[project]
name = "gringolandia"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.31",
    "dagster-dbt>=0.29.31",
    "dbt-core>=1.7.9",
    "dbt-duckdb>=1.7.5",
    "duckdb>=2.0.1",
    "httpx>=0.28.1",
    "polars>=2.2.0",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "gringolandia"
registry_modules = [
    "gringolandia.components.*",
]


